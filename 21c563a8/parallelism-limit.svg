<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
  <defs>
    <marker id="arr0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="880" height="360" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">并行能叠吞吐，叠不了单次延迟</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">一次编程就是那么久；只能靠同时多干几件事来分摊</text>
  <text x="40" y="110" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">串行：等一个干完再下一个</text>
  <rect x="40" y="124" width="90" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="85.0" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#9a3412">P0</text>
  <rect x="136" y="124" width="90" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="181.0" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#9a3412">P1</text>
  <rect x="232" y="124" width="90" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="277.0" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#9a3412">P2</text>
  <rect x="328" y="124" width="90" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="373.0" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#9a3412">P3</text>
  <line x1="40" y1="184" x2="418" y2="184" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr0)"/>
  <text x="232" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">总计 4 × tProg ≈ 2 ms</text>
  <text x="40" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#2563eb">并行：四个 plane 同时开工</text>
  <rect x="40" y="264" width="90" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="40" y="277" width="90" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="40" y="290" width="90" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <rect x="40" y="303" width="90" height="10" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="146" y="296" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#2563eb">总计 ≈ tProg ≈ 0.5 ms，但一次出去的是 4 页</text>
  <rect x="40" y="322" width="800" height="0" rx="8" fill="none"/>
  <text x="40" y="338" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#334155">延迟没变短，吞吐翻了几倍——这就是并行度唯一能做的事。</text>
</svg>
