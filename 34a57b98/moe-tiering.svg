<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="28" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">MoE 专家分层：热进 HBM，冷沉 HBF</text>

  <!-- 输入 token -->
  <rect x="280" y="46" width="160" height="36" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="69" text-anchor="middle" fill="#334155" font-size="12">输入 token</text>
  <line x1="360" y1="82" x2="360" y2="98" stroke="#334155" stroke-width="2"/>
  <polygon points="360,106 353,92 367,92" fill="#334155"/>

  <!-- 路由器 -->
  <rect x="270" y="106" width="180" height="52" rx="10" fill="#8b5cf6"/>
  <text x="360" y="128" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">路由器 Router</text>
  <text x="360" y="148" text-anchor="middle" fill="#ffffff" font-size="11">每个 token 只点名少数专家</text>

  <!-- HBM 层 -->
  <rect x="50" y="225" width="280" height="140" rx="12" fill="#0d9488"/>
  <text x="190" y="252" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">HBM · 热层</text>
  <text x="190" y="270" text-anchor="middle" fill="#ffffff" font-size="11">热专家 · 高频命中</text>
  <rect x="64" y="282" width="72" height="28" rx="6" fill="#ffffff"/>
  <text x="100" y="301" text-anchor="middle" fill="#0d9488" font-size="12" font-weight="bold">专家 3</text>
  <rect x="146" y="282" width="72" height="28" rx="6" fill="#ffffff"/>
  <text x="182" y="301" text-anchor="middle" fill="#0d9488" font-size="12" font-weight="bold">专家 17</text>
  <rect x="228" y="282" width="72" height="28" rx="6" fill="#ffffff"/>
  <text x="264" y="301" text-anchor="middle" fill="#0d9488" font-size="12" font-weight="bold">专家 42</text>
  <text x="190" y="340" text-anchor="middle" fill="#ffffff" font-size="11">容量约百 GB · 最快</text>

  <!-- HBF 层 -->
  <rect x="390" y="225" width="280" height="140" rx="12" fill="#ea580c"/>
  <text x="530" y="252" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">HBF · 温层</text>
  <text x="530" y="270" text-anchor="middle" fill="#ffffff" font-size="11">海量冷专家 · 最高约 512 GB</text>
  <rect x="404" y="282" width="72" height="28" rx="6" fill="#ffffff"/>
  <text x="440" y="301" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="bold">专家 8</text>
  <rect x="486" y="282" width="72" height="28" rx="6" fill="#ffffff"/>
  <text x="522" y="301" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="bold">专家 91</text>
  <rect x="568" y="282" width="72" height="28" rx="6" fill="#ffffff"/>
  <text x="604" y="301" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="bold">专家 …N</text>
  <text x="530" y="340" text-anchor="middle" fill="#ffffff" font-size="11">容量大 · 读快写慢</text>

  <!-- 路由箭头：高频命中 -->
  <line x1="310" y1="155" x2="200" y2="216" stroke="#334155" stroke-width="2"/>
  <polygon points="196,222 205,211 211,219" fill="#334155"/>
  <text x="222" y="196" text-anchor="middle" fill="#334155" font-size="11" font-weight="bold">高频命中</text>

  <!-- 路由箭头：低频命中 -->
  <line x1="410" y1="155" x2="522" y2="216" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="528,222 513,219 519,211" fill="#94a3b8"/>
  <text x="492" y="196" text-anchor="middle" fill="#64748b" font-size="11">低频命中</text>

  <!-- 按需搬运 -->
  <line x1="386" y1="298" x2="350" y2="298" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="334,298 348,292 348,304" fill="#ea580c"/>
  <text x="360" y="322" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="bold">按需预取</text>

  <!-- 底注 -->
  <text x="360" y="400" text-anchor="middle" fill="#64748b" font-size="12">专家参数：频繁读 · 很少写 · 量又大 —— 正好对上 NAND 的特性</text>
</svg>
