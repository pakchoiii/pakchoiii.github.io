<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="440" y="55" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">如果 L1 命中 = 1 秒，其他层级要等多久？</text>

  <!-- 对数刻度网格线（每格 = 10 倍时间） -->
  <line x1="275" y1="80" x2="275" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="355" y1="80" x2="355" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="435" y1="80" x2="435" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="515" y1="80" x2="515" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="595" y1="80" x2="595" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="675" y1="80" x2="675" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="755" y1="80" x2="755" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="835" y1="80" x2="835" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- 条形 -->
  <rect x="250" y="100" width="25"  height="36" rx="6" fill="#8b5cf6"/>
  <rect x="250" y="160" width="129" height="36" rx="6" fill="#2563eb"/>
  <rect x="250" y="220" width="185" height="36" rx="6" fill="#0d9488"/>
  <rect x="250" y="280" width="425" height="36" rx="6" fill="#ea580c"/>
  <rect x="250" y="340" width="585" height="36" rx="6" fill="#64748b"/>

  <!-- 行标签 -->
  <text x="235" y="124" text-anchor="end" fill="#334155" font-size="14">L1 缓存命中</text>
  <text x="235" y="184" text-anchor="end" fill="#334155" font-size="14">L3 缓存命中</text>
  <text x="235" y="244" text-anchor="end" fill="#334155" font-size="14">DRAM 访问</text>
  <text x="235" y="304" text-anchor="end" fill="#334155" font-size="14">NAND SSD</text>
  <text x="235" y="364" text-anchor="end" fill="#334155" font-size="14">硬盘寻道</text>

  <!-- 数值标签 -->
  <text x="287" y="124" text-anchor="start" fill="#8b5cf6" font-size="13" font-weight="bold">1 秒</text>
  <text x="391" y="184" text-anchor="start" fill="#2563eb" font-size="13" font-weight="bold">约 20 秒</text>
  <text x="447" y="244" text-anchor="start" fill="#0d9488" font-size="13" font-weight="bold">约 1 分半</text>
  <text x="687" y="304" text-anchor="start" fill="#ea580c" font-size="13" font-weight="bold">约 1 天多</text>
  <text x="823" y="364" text-anchor="end" fill="#ffffff" font-size="13" font-weight="bold">约 4 个月</text>

  <!-- 刻度标签 -->
  <text x="275" y="418" text-anchor="middle" fill="#64748b" font-size="11">1 秒</text>
  <text x="435" y="418" text-anchor="middle" fill="#64748b" font-size="11">100 秒</text>
  <text x="595" y="418" text-anchor="middle" fill="#64748b" font-size="11">约 3 小时</text>
  <text x="675" y="418" text-anchor="middle" fill="#64748b" font-size="11">约 1 天</text>
  <text x="835" y="418" text-anchor="middle" fill="#64748b" font-size="11">约 4 个月</text>

  <!-- 底部注释 -->
  <text x="440" y="448" text-anchor="middle" fill="#64748b" font-size="12">按典型延迟等比放大，数量级近似；相邻虚线 = 时间 × 10（对数刻度）</text>
</svg>
