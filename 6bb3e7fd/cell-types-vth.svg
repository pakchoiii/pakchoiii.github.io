<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>

  <!-- 顶部注释 -->
  <text x="440" y="36" text-anchor="middle" fill="#334155" font-size="13">同一个 Vth 窗口，被切成 2 / 8 / 16 份：切得越细，单 bit 越便宜，但读写越难、寿命越短</text>

  <!-- 面板标题 -->
  <text x="165" y="74" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">SLC：1 bit / Cell</text>
  <text x="435" y="74" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">TLC：3 bit / Cell</text>
  <text x="705" y="74" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">QLC：4 bit / Cell</text>

  <!-- SLC 面板 -->
  <line x1="60" y1="310" x2="60" y2="140" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="60,132 56,144 64,144" fill="#64748b"/>
  <text x="46" y="225" text-anchor="middle" fill="#64748b" font-size="11" transform="rotate(-90 46 225)">Cell 数量</text>
  <line x1="60" y1="310" x2="282" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="290,310 278,306 278,314" fill="#64748b"/>
  <text x="282" y="330" text-anchor="end" fill="#64748b" font-size="11">Vth →</text>
  <!-- 擦除态峰（灰） -->
  <path d="M 79 310 Q 115 120 151 310 Z" fill="#64748b"/>
  <!-- 编程态峰（蓝） -->
  <path d="M 189 310 Q 225 160 261 310 Z" fill="#2563eb"/>
  <!-- Read Level 虚线 -->
  <line x1="170" y1="190" x2="170" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="176" y="196" fill="#64748b" font-size="11">Read Level</text>
  <!-- 状态标签 -->
  <text x="115" y="332" text-anchor="middle" fill="#64748b" font-size="11">擦除态 = 1</text>
  <text x="225" y="332" text-anchor="middle" fill="#2563eb" font-size="11">编程态 = 0</text>
  <text x="165" y="358" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">2 个状态</text>

  <!-- TLC 面板 -->
  <line x1="330" y1="310" x2="330" y2="140" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="330,132 326,144 334,144" fill="#64748b"/>
  <line x1="330" y1="310" x2="556" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="564,310 552,306 552,314" fill="#64748b"/>
  <text x="556" y="330" text-anchor="end" fill="#64748b" font-size="11">Vth →</text>
  <!-- 擦除态峰（灰） -->
  <path d="M 332 310 Q 348 170 364 310 Z" fill="#64748b"/>
  <!-- 编程态峰（橙）×7 -->
  <path d="M 359 310 Q 375 190 391 310 Z" fill="#ea580c"/>
  <path d="M 386 310 Q 402 190 418 310 Z" fill="#ea580c"/>
  <path d="M 413 310 Q 429 190 445 310 Z" fill="#ea580c"/>
  <path d="M 440 310 Q 456 190 472 310 Z" fill="#ea580c"/>
  <path d="M 467 310 Q 483 190 499 310 Z" fill="#ea580c"/>
  <path d="M 494 310 Q 510 190 526 310 Z" fill="#ea580c"/>
  <path d="M 521 310 Q 537 190 553 310 Z" fill="#ea580c"/>
  <!-- Read Level 虚线 ×7 -->
  <line x1="361.5" y1="272" x2="361.5" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="388.5" y1="272" x2="388.5" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="415.5" y1="272" x2="415.5" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="442.5" y1="272" x2="442.5" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="469.5" y1="272" x2="469.5" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="496.5" y1="272" x2="496.5" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="523.5" y1="272" x2="523.5" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="435" y="358" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">8 个状态</text>

  <!-- QLC 面板 -->
  <line x1="600" y1="310" x2="600" y2="140" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="600,132 596,144 604,144" fill="#64748b"/>
  <line x1="600" y1="310" x2="824" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="832,310 820,306 820,314" fill="#64748b"/>
  <text x="824" y="330" text-anchor="end" fill="#64748b" font-size="11">Vth →</text>
  <!-- 擦除态峰（灰） -->
  <path d="M 601 310 Q 610 180 619 310 Z" fill="#64748b"/>
  <!-- 编程态峰（紫）×15 -->
  <path d="M 614.5 310 Q 623.5 200 632.5 310 Z" fill="#8b5cf6"/>
  <path d="M 628 310 Q 637 200 646 310 Z" fill="#8b5cf6"/>
  <path d="M 641.5 310 Q 650.5 200 659.5 310 Z" fill="#8b5cf6"/>
  <path d="M 655 310 Q 664 200 673 310 Z" fill="#8b5cf6"/>
  <path d="M 668.5 310 Q 677.5 200 686.5 310 Z" fill="#8b5cf6"/>
  <path d="M 682 310 Q 691 200 700 310 Z" fill="#8b5cf6"/>
  <path d="M 695.5 310 Q 704.5 200 713.5 310 Z" fill="#8b5cf6"/>
  <path d="M 709 310 Q 718 200 727 310 Z" fill="#8b5cf6"/>
  <path d="M 722.5 310 Q 731.5 200 740.5 310 Z" fill="#8b5cf6"/>
  <path d="M 736 310 Q 745 200 754 310 Z" fill="#8b5cf6"/>
  <path d="M 749.5 310 Q 758.5 200 767.5 310 Z" fill="#8b5cf6"/>
  <path d="M 763 310 Q 772 200 781 310 Z" fill="#8b5cf6"/>
  <path d="M 776.5 310 Q 785.5 200 794.5 310 Z" fill="#8b5cf6"/>
  <path d="M 790 310 Q 799 200 808 310 Z" fill="#8b5cf6"/>
  <path d="M 803.5 310 Q 812.5 200 821.5 310 Z" fill="#8b5cf6"/>
  <!-- Read Level 虚线 ×15 -->
  <line x1="616.8" y1="278" x2="616.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="630.3" y1="278" x2="630.3" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="643.8" y1="278" x2="643.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="657.3" y1="278" x2="657.3" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="670.8" y1="278" x2="670.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="684.3" y1="278" x2="684.3" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="697.8" y1="278" x2="697.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="711.3" y1="278" x2="711.3" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="724.8" y1="278" x2="724.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="738.3" y1="278" x2="738.3" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="751.8" y1="278" x2="751.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="765.3" y1="278" x2="765.3" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="778.8" y1="278" x2="778.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="792.3" y1="278" x2="792.3" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="805.8" y1="278" x2="805.8" y2="310" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="705" y="358" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">16 个状态</text>

  <!-- 底部图例 -->
  <text x="440" y="394" text-anchor="middle" fill="#64748b" font-size="12">灰色峰 = 擦除态（=1），彩色峰 = 编程态（=0）；峰间虚线 = Read Level（读取判断电压）</text>
</svg>
