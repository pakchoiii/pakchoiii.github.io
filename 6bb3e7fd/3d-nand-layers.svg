<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="460" fill="#ffffff"/>

  <!-- 左：平面 NAND -->
  <text x="210" y="64" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">平面 NAND（2D）</text>
  <text x="210" y="84" text-anchor="middle" fill="#64748b" font-size="11">存储串横躺在衬底上</text>
  <rect x="80" y="108" width="280" height="56" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="210" y="130" text-anchor="middle" fill="#64748b" font-size="11">平面微缩到 ~1x nm 之后：</text>
  <text x="210" y="148" text-anchor="middle" fill="#64748b" font-size="11">单元太挤、干扰太大，密度到顶了</text>

  <!-- 字线引脚 -->
  <text x="210" y="210" text-anchor="middle" fill="#64748b" font-size="11">字线（WL）</text>
  <line x1="95" y1="218" x2="95" y2="258" stroke="#334155" stroke-width="2"/>
  <line x1="141" y1="218" x2="141" y2="258" stroke="#334155" stroke-width="2"/>
  <line x1="187" y1="218" x2="187" y2="258" stroke="#334155" stroke-width="2"/>
  <line x1="233" y1="218" x2="233" y2="258" stroke="#334155" stroke-width="2"/>
  <line x1="279" y1="218" x2="279" y2="258" stroke="#334155" stroke-width="2"/>
  <line x1="325" y1="218" x2="325" y2="258" stroke="#334155" stroke-width="2"/>

  <!-- 存储串：SSL + 4 Cell + GSL -->
  <rect x="74" y="258" width="42" height="30" rx="4" fill="#0d9488"/>
  <text x="95" y="277" text-anchor="middle" fill="#ffffff" font-size="11">SSL</text>
  <rect x="120" y="258" width="42" height="30" rx="4" fill="#2563eb"/>
  <text x="141" y="277" text-anchor="middle" fill="#ffffff" font-size="11">Cell</text>
  <rect x="166" y="258" width="42" height="30" rx="4" fill="#2563eb"/>
  <text x="187" y="277" text-anchor="middle" fill="#ffffff" font-size="11">Cell</text>
  <rect x="212" y="258" width="42" height="30" rx="4" fill="#2563eb"/>
  <text x="233" y="277" text-anchor="middle" fill="#ffffff" font-size="11">Cell</text>
  <rect x="258" y="258" width="42" height="30" rx="4" fill="#2563eb"/>
  <text x="279" y="277" text-anchor="middle" fill="#ffffff" font-size="11">Cell</text>
  <rect x="304" y="258" width="42" height="30" rx="4" fill="#0d9488"/>
  <text x="325" y="277" text-anchor="middle" fill="#ffffff" font-size="11">GSL</text>

  <!-- 衬底 -->
  <rect x="70" y="296" width="280" height="28" fill="#64748b"/>
  <text x="210" y="314" text-anchor="middle" fill="#ffffff" font-size="12">衬底</text>
  <text x="210" y="444" text-anchor="middle" fill="#334155" font-size="12">单位面积的 bit 数：1 份</text>

  <!-- 中间箭头 -->
  <text x="437" y="200" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">把串竖起来</text>
  <line x1="392" y1="230" x2="478" y2="230" stroke="#334155" stroke-width="2"/>
  <polygon points="486,230 472,225 472,235" fill="#334155"/>
  <text x="437" y="258" text-anchor="middle" fill="#64748b" font-size="12">同一块地皮</text>
  <text x="437" y="276" text-anchor="middle" fill="#64748b" font-size="12">容量翻 N 倍</text>

  <!-- 右：3D NAND -->
  <text x="630" y="64" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">3D NAND：把串竖起来，往天上盖</text>
  <text x="630" y="84" text-anchor="middle" fill="#64748b" font-size="11">字线一层层水平堆叠，沟道垂直穿过</text>

  <!-- 字线层 ×10 -->
  <rect x="520" y="112" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="140" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="168" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="196" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="224" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="252" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="280" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="308" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="336" width="180" height="16" rx="3" fill="#ea580c"/>
  <rect x="520" y="364" width="180" height="16" rx="3" fill="#ea580c"/>

  <!-- 垂直沟道 -->
  <rect x="600" y="104" width="20" height="288" rx="9" fill="#0d9488"/>
  <!-- WL × 沟道交叉点 = Cell -->
  <circle cx="610" cy="120" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="148" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="176" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="204" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="232" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="260" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="288" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="316" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="344" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="610" cy="372" r="5.5" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>

  <!-- 衬底 -->
  <rect x="520" y="392" width="180" height="28" fill="#64748b"/>
  <text x="610" y="410" text-anchor="middle" fill="#ffffff" font-size="12">衬底</text>
  <text x="630" y="444" text-anchor="middle" fill="#334155" font-size="12">单位面积的 bit 数：N 份（N = 层数）</text>

  <!-- 右侧标注：字线 -->
  <path d="M 700 140 L 700 134 L 712 134" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="716" y="138" fill="#ea580c" font-size="12" font-weight="bold">字线（WL）</text>
  <text x="716" y="154" fill="#64748b" font-size="11">平板状，层层堆叠</text>
  <text x="716" y="170" fill="#64748b" font-size="11">×200~400 层</text>

  <!-- 右侧标注：垂直沟道 -->
  <path d="M 620 246 L 712 246" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="716" y="250" fill="#0d9488" font-size="12" font-weight="bold">垂直沟道（Channel）</text>
  <text x="716" y="266" fill="#64748b" font-size="11">存储串竖了起来</text>

  <!-- 右侧标注：交叉点 -->
  <path d="M 617 316 L 644 302 L 712 302" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="716" y="306" fill="#8b5cf6" font-size="12" font-weight="bold">交叉点 = Cell</text>
  <text x="716" y="322" fill="#64748b" font-size="11">就是一个存储单元</text>
</svg>
