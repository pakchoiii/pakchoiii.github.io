<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="440" y="36" text-anchor="middle" fill="#1e293b" font-size="20" font-weight="bold">全球 DRAM 市场份额（约数）</text>

  <!-- 饼图：圆心(250,265) 半径155 -->
  <path d="M 250 265 L 250 110 A 155 155 0 0 1 341.1 390.4 Z" fill="#2563eb"/>
  <path d="M 250 265 L 341.1 390.4 A 155 155 0 0 1 102.6 312.9 Z" fill="#ea580c"/>
  <path d="M 250 265 L 102.6 312.9 A 155 155 0 0 1 202.1 117.6 Z" fill="#0d9488"/>
  <path d="M 250 265 L 202.1 117.6 A 155 155 0 0 1 250 110 Z" fill="#64748b"/>

  <!-- 饼图内百分比标注 -->
  <text x="345" y="239" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">约 40%</text>
  <text x="219" y="365" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">约 30%</text>
  <text x="161" y="224" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">约 25%</text>

  <!-- 小扇区引导线 -->
  <line x1="226" y1="112" x2="194" y2="82" stroke="#64748b" stroke-width="1.5"/>
  <text x="188" y="76" text-anchor="end" fill="#334155" font-size="12">其他 约 5%</text>

  <!-- 图例 -->
  <rect x="520" y="100" width="18" height="18" rx="4" fill="#2563eb"/>
  <text x="548" y="114" fill="#1e293b" font-size="15" font-weight="bold">三星</text>
  <text x="860" y="114" text-anchor="end" fill="#2563eb" font-size="15" font-weight="bold">约 40%</text>
  <text x="548" y="134" fill="#64748b" font-size="12">长期份额第一，产品线最全</text>

  <rect x="520" y="160" width="18" height="18" rx="4" fill="#ea580c"/>
  <text x="548" y="174" fill="#1e293b" font-size="15" font-weight="bold">SK 海力士</text>
  <text x="860" y="174" text-anchor="end" fill="#ea580c" font-size="15" font-weight="bold">约 30%</text>
  <text x="548" y="194" fill="#64748b" font-size="12">HBM 时代凭 NVIDIA 主供一度登顶</text>

  <rect x="520" y="220" width="18" height="18" rx="4" fill="#0d9488"/>
  <text x="548" y="234" fill="#1e293b" font-size="15" font-weight="bold">美光</text>
  <text x="860" y="234" text-anchor="end" fill="#0d9488" font-size="15" font-weight="bold">约 25%</text>
  <text x="548" y="254" fill="#64748b" font-size="12">已供货 HBM3E</text>

  <rect x="520" y="280" width="18" height="18" rx="4" fill="#64748b"/>
  <text x="548" y="294" fill="#1e293b" font-size="15" font-weight="bold">其他</text>
  <text x="860" y="294" text-anchor="end" fill="#64748b" font-size="15" font-weight="bold">约 5%</text>
  <text x="548" y="314" fill="#64748b" font-size="12">含长鑫存储 CXMT 等追赶者</text>

  <!-- 汇总标注框 -->
  <rect x="520" y="340" width="340" height="52" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="690" y="372" text-anchor="middle" fill="#1e293b" font-size="17" font-weight="bold">三大巨头合计约 95%</text>

  <!-- 底部备注 -->
  <text x="250" y="458" text-anchor="middle" fill="#64748b" font-size="12">份额为约数，随存储周期明显波动</text>
</svg>
