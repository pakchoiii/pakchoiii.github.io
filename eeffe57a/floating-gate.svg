<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- 层叠结构（从上到下） -->
  <rect x="310" y="50" width="260" height="48" rx="6" fill="#2563eb"/>
  <text x="440" y="80" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">控制栅 Control Gate</text>

  <rect x="290" y="98" width="300" height="26" fill="#64748b"/>
  <text x="440" y="115" text-anchor="middle" fill="#ffffff" font-size="12">阻挡氧化层（绝缘）</text>

  <rect x="310" y="124" width="260" height="52" rx="6" fill="#ea580c"/>
  <text x="440" y="146" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">浮栅 Floating Gate</text>
  <text x="440" y="168" text-anchor="middle" fill="#ffffff" font-size="13">− − − − （电子被困在此）</text>

  <rect x="290" y="176" width="300" height="26" fill="#0d9488"/>
  <text x="440" y="193" text-anchor="middle" fill="#ffffff" font-size="12">隧穿氧化层（极薄）</text>

  <rect x="250" y="202" width="380" height="78" rx="6" fill="#1e293b"/>
  <text x="440" y="245" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">衬底 Substrate（电子的家）</text>

  <!-- 写入箭头（右侧，向上） -->
  <line x1="545" y1="270" x2="545" y2="152" stroke="#ea580c" stroke-width="3"/>
  <polygon points="545,142 536,158 554,158" fill="#ea580c"/>
  <text x="600" y="195" text-anchor="start" fill="#ea580c" font-size="13" font-weight="bold">写入：加高压</text>
  <text x="600" y="215" text-anchor="start" fill="#ea580c" font-size="13">电子隧穿进入浮栅</text>

  <!-- 擦除箭头（左侧，向下） -->
  <line x1="335" y1="150" x2="335" y2="268" stroke="#0d9488" stroke-width="3"/>
  <polygon points="335,280 327,264 343,264" fill="#0d9488"/>
  <text x="278" y="195" text-anchor="end" fill="#0d9488" font-size="13" font-weight="bold">擦除：反向电压</text>
  <text x="278" y="215" text-anchor="end" fill="#0d9488" font-size="13">电子被拉回衬底</text>

  <!-- 图注 -->
  <text x="440" y="320" text-anchor="middle" fill="#334155" font-size="13">读：加中间电压看导不导通——浮栅里有电子，阈值电压 Vth 升高，晶体管不导通</text>
  <text x="440" y="345" text-anchor="middle" fill="#64748b" font-size="13">浮栅四周全是绝缘层，电子无路可逃 → 断电十年也还在 → 非易失</text>
</svg>
