<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- 上升沿 / 下降沿 标注 -->
  <text x="110" y="50" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">上升沿</text>
  <text x="190" y="50" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="bold">下降沿</text>

  <!-- 边沿虚线 -->
  <line x1="110" y1="55" x2="110" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="190" y1="55" x2="190" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="270" y1="55" x2="270" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="350" y1="55" x2="350" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="430" y1="55" x2="430" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="510" y1="55" x2="510" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="590" y1="55" x2="590" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="670" y1="55" x2="670" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="750" y1="55" x2="750" y2="356" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 时钟波形 -->
  <path d="M110,130 L110,70 L190,70 L190,130 L270,130 L270,70 L350,70 L350,130 L430,130 L430,70 L510,70 L510,130 L590,130 L590,70 L670,70 L670,130 L750,130 L750,70 L810,70" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="95" y="105" text-anchor="end" fill="#2563eb" font-size="15" font-weight="bold">时钟 CLK</text>

  <!-- 一个周期标注 -->
  <line x1="110" y1="155" x2="270" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="110,155 122,151 122,159" fill="#64748b"/>
  <polygon points="270,155 258,151 258,159" fill="#64748b"/>
  <text x="190" y="172" text-anchor="middle" fill="#64748b" font-size="11">1 个周期 = 传 2 次</text>

  <!-- DQS 波形 -->
  <path d="M110,250 L110,190 L190,190 L190,250 L270,250 L270,190 L350,190 L350,250 L430,250 L430,190 L510,190 L510,250 L590,250 L590,190 L670,190 L670,250 L750,250 L750,190 L810,190" fill="none" stroke="#0d9488" stroke-width="3"/>
  <text x="95" y="225" text-anchor="end" fill="#0d9488" font-size="15" font-weight="bold">DQS 选通</text>

  <!-- 采样点 -->
  <circle cx="110" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="190" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="270" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="350" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="430" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="510" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="590" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="670" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="750" cy="220" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>

  <!-- 数据段 -->
  <rect x="110" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="190" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="270" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="350" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="430" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="510" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="590" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="670" y="300" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="750" y="300" width="60" height="48" rx="5" fill="#ea580c"/>
  <text x="146" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D0</text>
  <text x="226" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D1</text>
  <text x="306" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D2</text>
  <text x="386" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D3</text>
  <text x="466" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D4</text>
  <text x="546" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D5</text>
  <text x="626" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D6</text>
  <text x="706" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D7</text>
  <text x="780" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D8</text>
  <text x="95" y="330" text-anchor="end" fill="#ea580c" font-size="15" font-weight="bold">数据 DQ</text>

  <!-- 底部注释 -->
  <text x="450" y="398" text-anchor="middle" fill="#334155" font-size="13">时钟每跳一次沿（上升 + 下降），数据就换一批 → 一个周期传 2 次</text>
  <text x="450" y="424" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">传输率 MT/s = 2 × 时钟频率 MHz</text>
</svg>
