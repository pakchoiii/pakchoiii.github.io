<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>

  <!-- 上升沿 / 下降沿 标注 -->
  <text x="110" y="36" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">上升沿</text>
  <text x="190" y="36" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="bold">下降沿</text>

  <!-- 边沿虚线 -->
  <line x1="110" y1="41" x2="110" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="190" y1="41" x2="190" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="270" y1="41" x2="270" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="350" y1="41" x2="350" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="430" y1="41" x2="430" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="510" y1="41" x2="510" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="590" y1="41" x2="590" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="670" y1="41" x2="670" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="750" y1="41" x2="750" y2="301" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 时钟波形 -->
  <path d="M110,112 L110,52 L190,52 L190,112 L270,112 L270,52 L350,52 L350,112 L430,112 L430,52 L510,112 L510,52 L590,112 L590,52 L670,52 L670,112 L750,112 L750,52 L810,52" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="95" y="87" text-anchor="end" fill="#2563eb" font-size="15" font-weight="bold">时钟 CLK</text>

  <!-- 一个周期标注 -->
  <line x1="110" y1="130" x2="270" y2="130" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="110,130 122,126 122,134" fill="#64748b"/>
  <polygon points="270,130 258,126 258,134" fill="#64748b"/>
  <text x="190" y="147" text-anchor="middle" fill="#64748b" font-size="11">1 个周期 = 传 2 次</text>

  <!-- DQS 波形 -->
  <path d="M110,221 L110,161 L190,161 L190,221 L270,221 L270,161 L350,161 L350,221 L430,221 L430,161 L510,221 L510,161 L590,221 L590,161 L670,161 L670,221 L750,221 L750,161 L810,161" fill="none" stroke="#0d9488" stroke-width="3"/>
  <text x="95" y="196" text-anchor="end" fill="#0d9488" font-size="15" font-weight="bold">DQS 选通</text>

  <!-- 采样点 -->
  <circle cx="110" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="190" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="270" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="350" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="430" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="510" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="590" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="670" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="750" cy="191" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>

  <!-- 数据段 -->
  <rect x="110" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="190" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="270" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="350" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="430" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="510" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="590" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="670" y="245" width="72" height="48" rx="5" fill="#ea580c"/>
  <rect x="750" y="245" width="60" height="48" rx="5" fill="#ea580c"/>
  <text x="146" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D0</text>
  <text x="226" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D1</text>
  <text x="306" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D2</text>
  <text x="386" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D3</text>
  <text x="466" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D4</text>
  <text x="546" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D5</text>
  <text x="626" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D6</text>
  <text x="706" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D7</text>
  <text x="780" y="275" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">D8</text>
  <text x="95" y="275" text-anchor="end" fill="#ea580c" font-size="15" font-weight="bold">数据 DQ</text>

  <!-- 底部注释 -->
  <text x="450" y="317" text-anchor="middle" fill="#334155" font-size="13">时钟每跳一次沿（上升 + 下降），数据就换一批 → 一个周期传 2 次</text>
  <text x="450" y="341" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="bold">传输率 MT/s = 2 × 时钟频率 MHz</text>
</svg>
