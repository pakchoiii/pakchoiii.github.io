<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- 公式行 -->
  <rect x="50" y="60" width="180" height="64" rx="10" fill="#2563eb"/>
  <text x="140" y="88" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">位宽</text>
  <text x="140" y="110" text-anchor="middle" fill="#ffffff" font-size="11">每拍传多少 bit</text>

  <text x="255" y="100" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="bold">×</text>

  <rect x="285" y="60" width="190" height="64" rx="10" fill="#0d9488"/>
  <text x="380" y="88" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">数据率</text>
  <text x="380" y="110" text-anchor="middle" fill="#ffffff" font-size="11">每秒多少拍（MT/s）</text>

  <text x="500" y="100" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="bold">÷</text>

  <rect x="530" y="60" width="130" height="64" rx="10" fill="#8b5cf6"/>
  <text x="595" y="90" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">8</text>
  <text x="595" y="110" text-anchor="middle" fill="#ffffff" font-size="11">bit 换算成字节</text>

  <text x="690" y="100" text-anchor="middle" fill="#1e293b" font-size="24" font-weight="bold">=</text>

  <rect x="720" y="60" width="130" height="64" rx="10" fill="#ea580c"/>
  <text x="785" y="88" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">带宽</text>
  <text x="785" y="110" text-anchor="middle" fill="#ffffff" font-size="11">GB/s</text>

  <!-- 例 1：DDR5 -->
  <rect x="30" y="170" width="390" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="202" text-anchor="start" fill="#2563eb" font-size="15" font-weight="bold">DDR5-6400 内存条</text>
  <text x="50" y="232" text-anchor="start" fill="#334155" font-size="14">64 位 × 6400 MT/s ÷ 8 = 51.2 GB/s</text>
  <text x="50" y="260" text-anchor="start" fill="#64748b" font-size="12">双通道：位宽 ×2 → 约 102.4 GB/s</text>

  <!-- 例 2：HBM3E -->
  <rect x="460" y="170" width="390" height="120" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="480" y="202" text-anchor="start" fill="#0d9488" font-size="15" font-weight="bold">HBM3E（堆叠 DRAM）</text>
  <text x="480" y="232" text-anchor="start" fill="#334155" font-size="14">1024 位 × 9.6 Gb/s ÷ 8 ≈ 1.2 TB/s</text>
  <text x="480" y="260" text-anchor="start" fill="#64748b" font-size="12">位宽是内存条的 16 倍</text>

  <!-- 例 3：HBM4 -->
  <rect x="30" y="320" width="390" height="120" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="50" y="352" text-anchor="start" fill="#8b5cf6" font-size="15" font-weight="bold">HBM4</text>
  <text x="50" y="382" text-anchor="start" fill="#334155" font-size="14">2048 位 × 8 Gb/s ÷ 8 ≈ 2 TB/s</text>
  <text x="50" y="410" text-anchor="start" fill="#64748b" font-size="12">接口再翻倍 → 带宽再翻倍</text>

  <!-- 例 4：PCIe -->
  <rect x="460" y="320" width="390" height="120" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="352" text-anchor="start" fill="#ea580c" font-size="15" font-weight="bold">PCIe 5.0 ×4（SSD）</text>
  <text x="480" y="382" text-anchor="start" fill="#334155" font-size="14">4 × 32 GT/s × 128/130 ÷ 8 ≈ 15.75 GB/s</text>
  <text x="480" y="410" text-anchor="start" fill="#64748b" font-size="12">扣掉协议开销，实测约 14 GB/s</text>

  <!-- 底部注释 -->
  <text x="440" y="470" text-anchor="middle" fill="#64748b" font-size="12">（Gb/s = 每引脚速率；PCIe 走"通道数 × 每通道速率"，再乘编码效率）</text>
</svg>
