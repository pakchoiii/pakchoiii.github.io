  <line x1="192" y1="235" x2="214" y2="235" stroke="#0d9488" stroke-width="1.4" marker-end="url(#arr1)"/>
  <line x1="372" y1="235" x2="452" y2="235" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr2)" marker-start="url(#arr2)"/>
