  <text x="125.0" y="168.832" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#1e293b">Cell 阵列</text>
  <rect x="60" y="208" width="130" height="54" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3"/>
