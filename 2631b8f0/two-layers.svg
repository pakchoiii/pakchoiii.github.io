  <line x1="632" y1="230" x2="656" y2="230" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arr3)"/>
  <rect x="40" y="330" width="800" height="52" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
  <text x="64" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#115e59">规格书写的是「纠之前」的 BER；主控拿到的是「纠之后」的结果——这两个数字常常差好几个数量级。</text>
