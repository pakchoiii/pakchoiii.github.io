  <rect width="880" height="400" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">数据出门要过两道纠错闸门</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">一道在 die 里，一道在主控里；中间隔着那条总线</text>
  <rect x="40" y="96" width="330" height="210" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
