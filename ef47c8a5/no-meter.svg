<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300">
  <rect width="880" height="300" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">Vth 是多少？芯片答不出来</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">读不是测量，是一次判断</text>
  <rect x="40" y="104" width="370" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="60" y="136" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" fill="#64748b">想象中的测法</text>
  <text x="60" y="164" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">像量电压那样，读出一个数：</text>
  <text x="60" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#94a3b8">Vth = 5.23 V</text>
  <line x1="334" y1="118" x2="394" y2="212" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="394" y1="118" x2="334" y2="212" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="470" y="104" width="370" height="122" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="490" y="136" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" fill="#1e40af">实际能做的只有一件事</text>
  <text x="490" y="164" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#334155">给一个 Vref，问这颗 Cell：</text>
  <text x="490" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#2563eb">导通 / 截止　—— 两个答案</text>
  <rect x="40" y="244" width="800" height="42" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="1.1" fill-opacity="0.55"/>
  <text x="60" y="267" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">一次读只给 1 bit。单颗 Cell 的 Vth，永远测不出来。</text>
</svg>
