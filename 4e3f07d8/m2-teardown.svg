<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400">
  <rect width="880" height="400" rx="16" fill="#ffffff"/>
  <text x="40" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">一块 M.2 拆开：真正干活的就五样东西</text>
  <text x="40" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#64748b">示意画法，不按实际布局；固件没有实体，虚线框只是它跑的位置</text>

  <!-- 板子 -->
  <rect x="56" y="76" width="768" height="254" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- 金手指 -->
  <rect x="56" y="104" width="24" height="202" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <g stroke="#d97706" stroke-opacity="0.55" stroke-width="1">
    <line x1="60" y1="118" x2="76" y2="118"/>
    <line x1="60" y1="138" x2="76" y2="138"/>
    <line x1="60" y1="158" x2="76" y2="158"/>
    <line x1="60" y1="178" x2="76" y2="178"/>
    <line x1="60" y1="198" x2="76" y2="198"/>
    <line x1="60" y1="218" x2="76" y2="218"/>
    <line x1="60" y1="238" x2="76" y2="238"/>
    <line x1="60" y1="258" x2="76" y2="258"/>
    <line x1="60" y1="278" x2="76" y2="278"/>
    <line x1="60" y1="296" x2="76" y2="296"/>
  </g>
  <circle cx="68" cy="90" r="9" fill="#d97706"/>
  <text x="68" y="95" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <!-- 主控 -->
  <rect x="104" y="110" width="148" height="136" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <circle cx="120" cy="126" r="9" fill="#2563eb"/>
  <text x="120" y="131" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="178" y="158" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b" text-anchor="middle">主控</text>
  <text x="178" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">Controller SoC</text>
  <text x="178" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#2563eb" text-anchor="middle">翻译 + 调度</text>

  <!-- 固件（软件，没有实体） -->
  <rect x="264" y="110" width="148" height="136" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="280" cy="126" r="9" fill="#2563eb"/>
  <text x="280" y="131" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="338" y="158" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b" text-anchor="middle">固件</text>
  <text x="338" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">Firmware</text>
  <text x="338" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#2563eb" text-anchor="middle">几十万行代码</text>

  <!-- DRAM -->
  <rect x="424" y="110" width="132" height="136" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <circle cx="440" cy="126" r="9" fill="#ea580c"/>
  <text x="440" y="131" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="490" y="158" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#1e293b" text-anchor="middle">DRAM</text>
  <text x="490" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">映射表 + 缓冲</text>
  <text x="490" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#ea580c" text-anchor="middle">低端盘会省掉</text>

  <!-- NAND A -->
  <rect x="568" y="94" width="190" height="76" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
  <circle cx="584" cy="110" r="9" fill="#8b5cf6"/>
  <text x="584" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="663" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#1e293b" text-anchor="middle">NAND 颗粒</text>
  <text x="663" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">数据真正躺在这里</text>

  <!-- NAND B -->
  <rect x="568" y="182" width="190" height="76" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
  <circle cx="584" cy="198" r="9" fill="#8b5cf6"/>
  <text x="584" y="203" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="663" y="214" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#1e293b" text-anchor="middle">NAND 颗粒</text>
  <text x="663" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">一颗盘通常有 2~8 颗</text>

  <!-- 角落小注：外围 -->
  <text x="104" y="286" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#94a3b8">※ 板上还有电容、电源、指示灯，不存数据</text>
  <text x="126" y="306" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#94a3b8">但掉电那一刻，靠它们把缓存里的数据写完</text>

  <text x="56" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#92400e">接口：插进插槽，和主机说话</text>
  <text x="440" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b" text-anchor="middle">M.2 2280 = 宽 22 × 长 80 mm；颗粒能换厂家，固件几乎不可能换</text>
</svg>
