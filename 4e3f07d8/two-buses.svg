<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" width="880" height="462">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="462" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">两条完全不同的总线，中间夹着一个翻译</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#64748b">左半边管「盘」，右半边管「芯片」——两套文档、两个联盟、两拨人</text>

  <!-- 主机 -->
  <rect x="40" y="104" width="148" height="208" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="114" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">主机 Host</text>
  <text x="114" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">文件系统 / 驱动</text>
  <text x="114" y="236" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">提交队列</text>
  <text x="114" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">发「读 LBA」</text>

  <!-- 主控 -->
  <rect x="308" y="104" width="252" height="208" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="434" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20.8" font-weight="700" fill="#1e293b" text-anchor="middle">主控</text>
  <text x="434" y="174" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#1e40af" text-anchor="middle">两套话都要会说</text>
  <line x1="330" y1="190" x2="538" y2="190" stroke="#bfdbfe" stroke-width="1"/>
  <text x="434" y="218" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" text-anchor="middle">PCIe / NVMe 控制器</text>
  <text x="434" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" text-anchor="middle">固件 CPU + ECC 引擎</text>
  <text x="434" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#475569" text-anchor="middle">NAND 控制器（多通道）</text>
  <text x="434" y="296" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#2563eb" text-anchor="middle">「读 LBA」→「读某页」</text>

  <!-- NAND -->
  <rect x="680" y="104" width="160" height="208" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="760" y="150" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">NAND 颗粒</text>
  <text x="760" y="186" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">双沿采样</text>
  <text x="760" y="214" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">8 根 DQ 并行</text>
  <text x="760" y="242" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">命令 / 地址周期</text>
  <text x="760" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">一次搬一页</text>
  <text x="760" y="298" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#8b5cf6" text-anchor="middle">只认页，不认 LBA</text>

  <!-- 两条总线 -->
  <line x1="188" y1="208" x2="308" y2="208" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="248" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#334155" text-anchor="middle">PCIe / NVMe</text>
  <text x="248" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b" text-anchor="middle">微秒级往返</text>

  <line x1="560" y1="208" x2="680" y2="208" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="620" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#334155" text-anchor="middle">ONFI/Toggle</text>
  <text x="620" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b" text-anchor="middle">百微秒至毫秒</text>

  <!-- DRAM -->
  <rect x="308" y="330" width="252" height="80" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="434" y="364" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" font-weight="700" fill="#1e293b" text-anchor="middle">DRAM</text>
  <text x="434" y="390" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#475569" text-anchor="middle">映射表与数据缓冲的落脚处</text>
  <line x1="434" y1="312" x2="434" y2="330" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar2)" marker-start="url(#ar2)"/>

  <text x="440" y="442" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#94a3b8" text-anchor="middle">新人最常混的一句：把 NVMe 的版本号当成「闪存的版本」——它们根本不是一件事</text>
</svg>
