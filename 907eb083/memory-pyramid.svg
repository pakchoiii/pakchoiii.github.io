<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- 四层阶梯 -->
  <rect x="360" y="40"  width="160" height="80" rx="10" fill="#8b5cf6"/>
  <rect x="290" y="140" width="300" height="80" rx="10" fill="#2563eb"/>
  <rect x="220" y="240" width="440" height="80" rx="10" fill="#ea580c"/>
  <rect x="150" y="340" width="580" height="80" rx="10" fill="#64748b"/>

  <!-- 各层文字 -->
  <text x="440" y="72"  text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">SRAM 缓存</text>
  <text x="440" y="96"  text-anchor="middle" fill="#ffffff" font-size="12">最快 · 最小 · 最贵</text>

  <text x="440" y="172" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">DRAM 主内存</text>
  <text x="440" y="196" text-anchor="middle" fill="#ffffff" font-size="12">快 · 小 · 贵</text>

  <text x="440" y="272" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">HBF 高带宽闪存</text>
  <text x="440" y="296" text-anchor="middle" fill="#ffffff" font-size="12">快 · 较大 · 中等（新层级）</text>

  <text x="440" y="372" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">NAND SSD / 硬盘</text>
  <text x="440" y="396" text-anchor="middle" fill="#ffffff" font-size="12">慢 · 大 · 便宜</text>

  <!-- NEW 徽标 -->
  <rect x="602" y="246" width="48" height="20" rx="10" fill="#ffffff"/>
  <text x="626" y="261" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="bold">NEW</text>

  <!-- 左侧箭头：速度越快 成本越高 -->
  <line x1="70" y1="420" x2="70" y2="40" stroke="#334155" stroke-width="2"/>
  <polygon points="70,32 63,48 77,48" fill="#334155"/>
  <text x="70" y="230" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold" transform="rotate(-90 70 230)">速度越快 · 成本越高</text>

  <!-- 右侧箭头：容量越大 成本越低 -->
  <line x1="822" y1="40" x2="822" y2="420" stroke="#334155" stroke-width="2"/>
  <polygon points="822,428 815,412 829,412" fill="#334155"/>
  <text x="822" y="230" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold" transform="rotate(90 822 230)">容量越大 · 成本越低</text>
</svg>
