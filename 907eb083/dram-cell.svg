<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>

  <!-- 位线 -->
  <line x1="130" y1="40" x2="130" y2="310" stroke="#2563eb" stroke-width="3"/>
  <text x="130" y="30" text-anchor="middle" fill="#2563eb" font-size="15" font-weight="bold">位线 Bitline</text>

  <!-- 字线 -->
  <line x1="60" y1="120" x2="330" y2="120" stroke="#8b5cf6" stroke-width="3"/>
  <text x="330" y="112" text-anchor="end" fill="#8b5cf6" font-size="15" font-weight="bold">字线 Wordline</text>

  <!-- 晶体管（开关） -->
  <circle cx="130" cy="120" r="13" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="130" y="150" text-anchor="middle" fill="#334155" font-size="13">晶体管（开关）</text>

  <!-- 到电容的连线 -->
  <line x1="143" y1="120" x2="240" y2="120" stroke="#334155" stroke-width="3"/>

  <!-- 电容两个极板 -->
  <line x1="240" y1="80" x2="240" y2="160" stroke="#ea580c" stroke-width="4"/>
  <line x1="285" y1="80" x2="285" y2="160" stroke="#ea580c" stroke-width="4"/>
  <text x="262" y="115" text-anchor="middle" fill="#ea580c" font-size="16" font-weight="bold">+</text>
  <text x="262" y="135" text-anchor="middle" fill="#ea580c" font-size="16" font-weight="bold">+</text>
  <text x="262" y="70" text-anchor="middle" fill="#ea580c" font-size="13" font-weight="bold">电容（存电荷）</text>

  <!-- 接地符号 -->
  <line x1="285" y1="160" x2="285" y2="190" stroke="#334155" stroke-width="3"/>
  <line x1="270" y1="190" x2="300" y2="190" stroke="#334155" stroke-width="3"/>
  <line x1="275" y1="198" x2="295" y2="198" stroke="#334155" stroke-width="3"/>
  <line x1="280" y1="206" x2="290" y2="206" stroke="#334155" stroke-width="3"/>

  <!-- 图注 -->
  <text x="240" y="260" text-anchor="middle" fill="#334155" font-size="14">有电荷 = 1　·　无电荷 = 0</text>
</svg>
