<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <!-- 封装外框 -->
  <rect x="40" y="40" width="800" height="390" rx="12" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="56" y="66" text-anchor="start" fill="#1e293b" font-size="12" font-weight="bold">封装（Package）俯视图</text>

  <!-- 中介层 -->
  <rect x="80" y="90" width="720" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="114" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">中介层（Interposer）</text>

  <!-- 连接线（GPU ↔ 各堆栈） -->
  <line x1="195" y1="155" x2="330" y2="205" stroke="#ea580c" stroke-width="7"/>
  <line x1="195" y1="250" x2="330" y2="255" stroke="#ea580c" stroke-width="7"/>
  <line x1="195" y1="345" x2="330" y2="305" stroke="#ea580c" stroke-width="7"/>
  <line x1="685" y1="155" x2="550" y2="205" stroke="#ea580c" stroke-width="7"/>
  <line x1="685" y1="250" x2="550" y2="255" stroke="#ea580c" stroke-width="7"/>
  <line x1="685" y1="345" x2="550" y2="305" stroke="#ea580c" stroke-width="7"/>

  <!-- GPU -->
  <rect x="330" y="185" width="220" height="140" rx="8" fill="#2563eb"/>
  <text x="440" y="252" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">GPU</text>
  <text x="440" y="274" text-anchor="middle" fill="#ffffff" font-size="12">计算芯片</text>

  <!-- 左侧 3 个 HBM 堆栈 -->
  <rect x="115" y="110" width="80" height="90" rx="6" fill="#0d9488"/>
  <rect x="115" y="205" width="80" height="90" rx="6" fill="#0d9488"/>
  <rect x="115" y="300" width="80" height="90" rx="6" fill="#0d9488"/>
  <text x="155" y="150" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">HBM</text>
  <text x="155" y="170" text-anchor="middle" fill="#ffffff" font-size="11">24 GB</text>
  <text x="155" y="245" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">HBM</text>
  <text x="155" y="265" text-anchor="middle" fill="#ffffff" font-size="11">24 GB</text>
  <text x="155" y="340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">HBM</text>
  <text x="155" y="360" text-anchor="middle" fill="#ffffff" font-size="11">24 GB</text>

  <!-- 右侧 3 个 HBM 堆栈 -->
  <rect x="685" y="110" width="80" height="90" rx="6" fill="#0d9488"/>
  <rect x="685" y="205" width="80" height="90" rx="6" fill="#0d9488"/>
  <rect x="685" y="300" width="80" height="90" rx="6" fill="#0d9488"/>
  <text x="725" y="150" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">HBM</text>
  <text x="725" y="170" text-anchor="middle" fill="#ffffff" font-size="11">24 GB</text>
  <text x="725" y="245" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">HBM</text>
  <text x="725" y="265" text-anchor="middle" fill="#ffffff" font-size="11">24 GB</text>
  <text x="725" y="340" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">HBM</text>
  <text x="725" y="360" text-anchor="middle" fill="#ffffff" font-size="11">24 GB</text>

  <!-- 连接标注 -->
  <text x="440" y="170" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="bold">每条连接 = 一个 1024 位通道（HBM4 起为 2048 位）</text>

  <!-- 底部注释 -->
  <text x="440" y="452" text-anchor="middle" fill="#334155" font-size="12">多个堆栈并联：容量与带宽都按堆栈数相加</text>
  <text x="440" y="472" text-anchor="middle" fill="#64748b" font-size="11">H100 80 GB｜H200 141 GB｜B200 192 GB——全是这么拼出来的</text>
</svg>
