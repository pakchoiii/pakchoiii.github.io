<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430">
  <rect width="880" height="430" rx="16" fill="#ffffff"/>
  <text x="40" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">MLC 的二分读取：每一问砍掉一半可能性</text>
  <text x="40" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#64748b">4 个状态只需 2 次判断——因为第一问就排除了两个</text>

  <!-- 4 状态条 -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" text-anchor="middle">
    <rect x="200" y="80" width="120" height="34" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="260" y="103" fill="#6d28d9">Er</text>
    <rect x="320" y="80" width="120" height="34" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="380" y="103" fill="#6d28d9">P1</text>
    <rect x="440" y="80" width="120" height="34" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="500" y="103" fill="#6d28d9">P2</text>
    <rect x="560" y="80" width="120" height="34" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="620" y="103" fill="#6d28d9">P3</text>
  </g>
  <text x="440" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#94a3b8" text-anchor="middle">Vth 由低到高 →</text>

  <!-- 第一问 -->
  <line x1="440" y1="140" x2="440" y2="156" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="308" y="156" width="264" height="40" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="440" y="181" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#c2410c" text-anchor="middle">(1) 加 RL2 —— 中间那档</text>

  <!-- 分支 -->
  <path d="M440,196 L440,214 M440,214 L300,214 L300,232" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M440,214 L580,214 L580,232" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <text x="352" y="208" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b" text-anchor="middle">导通</text>
  <text x="528" y="208" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b" text-anchor="middle">截止</text>

  <!-- 第二问 -->
  <rect x="196" y="232" width="208" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="257" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#1e40af" text-anchor="middle">(2) 加 RL1</text>
  <rect x="476" y="232" width="208" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="580" y="257" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#1e40af" text-anchor="middle">(3) 加 RL3</text>

  <!-- 结果 -->
  <path d="M300,272 L300,300 M300,300 L232,300 L232,318" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M300,300 L368,300 L368,318" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M580,272 L580,300 M580,300 L512,300 L512,318" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M580,300 L648,300 L648,318" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" text-anchor="middle">
    <rect x="164" y="318" width="136" height="38" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="232" y="342" fill="#6d28d9">导通 → Er</text>
    <rect x="300" y="318" width="136" height="38" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="368" y="342" fill="#6d28d9">截止 → P1</text>
    <rect x="444" y="318" width="136" height="38" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="512" y="342" fill="#6d28d9">导通 → P2</text>
    <rect x="580" y="318" width="136" height="38" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="648" y="342" fill="#6d28d9">截止 → P3</text>
  </g>

  <text x="440" y="396" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#334155" text-anchor="middle">注意：这是「定位一个 Cell 的完整状态」的流程</text>
  <text x="440" y="416" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#94a3b8" text-anchor="middle">实际读某一页时不需要定位全部状态，只加与该 bit 相关的电平</text>
</svg>
