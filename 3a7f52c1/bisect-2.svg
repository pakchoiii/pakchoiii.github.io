<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" width="880" height="364">
  <rect width="880" height="364" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">第二问，在剩下的两个里再切</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">假设落在右半（P2 或 P3），加 RL3</text>
  <rect x="176" y="142" width="116" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="234.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#94a3b8">Er</text>
  <rect x="304" y="142" width="116" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="362.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#94a3b8">P1</text>
  <rect x="432" y="142" width="116" height="58" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="490.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#7c3aed">P2</text>
  <rect x="560" y="142" width="116" height="58" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="618.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#7c3aed">P3</text>
  <text x="150" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="end" fill="#64748b">状态</text>
  <text x="692" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">→ Vth 升高</text>
  <line x1="420" y1="130" x2="420" y2="210" stroke="#94a3b8" stroke-width="2.6" stroke-linecap="round"/>
  <text x="420" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#94a3b8">RL2 已问</text>
  <line x1="548" y1="130" x2="548" y2="210" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round"/>
  <text x="548" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#ea580c">RL3</text>
  <path d="M 176,221 L 176,212 L 420,212 L 420,221" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>
  <text x="298.0" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#94a3b8">已排除</text>
  <path d="M 420,221 L 420,212 L 548,212 L 548,221" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="484.0" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">P2　1 个</text>
  <path d="M 548,221 L 548,212 L 676,212 L 676,221" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="612.0" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">P3　1 个</text>
  <text x="60" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#334155">落在左半是同样的账：加 RL1，再砍成 Er 与 P1。哪一边都只用再问一次。</text>
  <rect x="40" y="300" width="800" height="42" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="1.1" fill-opacity="0.55"/>
  <text x="60" y="321" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">两问定 4 档。8 档要 3 问、16 档要 4 问——每多一个 bit，多问一次。</text>
</svg>
