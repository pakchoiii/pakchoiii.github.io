<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 413" width="880" height="413">
  <rect width="880" height="413" rx="16" fill="#ffffff"/>
  <text x="40" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">N 个状态，N−1 个判断电压</text>
  <text x="40" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#64748b">每一条橙色竖线就是一次判断：它只能回答「在左边还是右边」</text>

  <!-- SLC -->
  <text x="40" y="106" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#2563eb">SLC</text>
  <text x="40" y="124" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b">2 段 · 1 个电平</text>
