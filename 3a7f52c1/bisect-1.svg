<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 364" width="880" height="364">
  <rect width="880" height="364" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">第一问，打中间</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">4 个状态，一刀下去只剩一半——这就是二分的全部</text>
  <rect x="176" y="142" width="116" height="58" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="234.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#7c3aed">Er</text>
  <rect x="304" y="142" width="116" height="58" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="362.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#7c3aed">P1</text>
  <rect x="432" y="142" width="116" height="58" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="490.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#7c3aed">P2</text>
  <rect x="560" y="142" width="116" height="58" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="618.0" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#7c3aed">P3</text>
  <text x="150" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="end" fill="#64748b">状态</text>
  <text x="692" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">→ Vth 升高</text>
  <line x1="420" y1="130" x2="420" y2="210" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round"/>
  <text x="420" y="120" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#ea580c">RL2</text>
  <path d="M 176,221 L 176,212 L 420,212 L 420,221" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="298.0" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">Er / P1　2 个</text>
  <path d="M 420,221 L 420,212 L 676,212 L 676,221" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="548.0" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">P2 / P3　2 个</text>
  <text x="60" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#334155">导通 → 在左边；截止 → 在右边。芯片只回这一个字，不告诉你落在哪一档。</text>
  <rect x="40" y="300" width="800" height="42" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="1.1" fill-opacity="0.55"/>
  <text x="60" y="321" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">一次判断产出 1 个 bit：在左还是在右。4 个状态要 2 次判断，因为 2² = 4。</text>
</svg>
