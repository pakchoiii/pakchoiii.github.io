<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>

  <!-- 上：传统 SSD -->
  <text x="440" y="56" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="bold">传统 SSD：数据要跑一整条链路</text>

  <rect x="60" y="84" width="150" height="64" rx="10" fill="#64748b"/>
  <text x="135" y="110" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">NAND 阵列</text>
  <text x="135" y="130" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">多颗 Die</text>

  <rect x="260" y="84" width="170" height="64" rx="10" fill="#0d9488"/>
  <text x="345" y="110" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">SSD 控制器</text>
  <text x="345" y="130" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">FTL · 纠错 · 协议转换</text>

  <rect x="480" y="84" width="170" height="64" rx="10" fill="#8b5cf6"/>
  <text x="565" y="110" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">PCIe / NVMe</text>
  <text x="565" y="130" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">走线长 · 协议栈深</text>

  <rect x="700" y="84" width="150" height="64" rx="10" fill="#2563eb"/>
  <text x="775" y="110" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">CPU</text>
  <text x="775" y="130" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.85">远端访问</text>

  <!-- 链路箭头 -->
  <line x1="214" y1="116" x2="246" y2="116" stroke="#334155" stroke-width="2.5"/>
  <polygon points="254,116 242,112 242,120" fill="#334155"/>
  <line x1="434" y1="116" x2="466" y2="116" stroke="#334155" stroke-width="2.5"/>
  <polygon points="474,116 462,112 462,120" fill="#334155"/>
  <line x1="654" y1="116" x2="686" y2="116" stroke="#334155" stroke-width="2.5"/>
  <polygon points="694,116 682,112 682,120" fill="#334155"/>

  <!-- 被 HBF 取代的段 -->
  <rect x="250" y="74" width="410" height="84" rx="12" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="455" y="184" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="bold">HBF 把这一整段换成了 UCIe 直连</text>

  <!-- 下：HBF -->
  <text x="440" y="232" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="bold">HBF：die 级直连，路径大幅缩短</text>

  <rect x="180" y="260" width="230" height="72" rx="10" fill="#ea580c"/>
  <text x="295" y="290" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">HBF 堆栈</text>
  <text x="295" y="312" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.9">8 / 16 层 NAND Die（TSV 贯穿）</text>

  <rect x="570" y="260" width="230" height="72" rx="10" fill="#2563eb"/>
  <text x="685" y="290" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">CPU / GPU</text>
  <text x="685" y="312" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.9">计算 Die（近存）</text>

  <!-- UCIe 直连 -->
  <line x1="428" y1="296" x2="552" y2="296" stroke="#ea580c" stroke-width="7"/>
  <polygon points="416,296 428,290 428,302" fill="#ea580c"/>
  <polygon points="564,296 552,290 552,302" fill="#ea580c"/>
  <text x="490" y="278" text-anchor="middle" fill="#ea580c" font-size="13" font-weight="bold">UCIe 直连</text>
  <text x="490" y="324" text-anchor="middle" fill="#64748b" font-size="12">极短 · 超宽 · 近存</text>

  <!-- 底部小结 -->
  <text x="440" y="398" text-anchor="middle" fill="#334155" font-size="13">同样一颗 NAND，走的路不同，带宽就差出一到两个数量级</text>
</svg>
