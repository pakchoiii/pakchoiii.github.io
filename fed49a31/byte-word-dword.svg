<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452">
  <rect width="880" height="452" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">32 位摆在那儿，切法有三种</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">图上最高位画在左边，总线上低位先发——这两个「第一」不是同一个</text>
  <text x="186" y="143" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="end" fill="#1e293b">Dword</text>
  <rect x="200.0" y="122" width="557.0" height="38" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="478.5" y="147" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#1e40af">Dword　bit31 … bit0</text>
  <text x="772" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">32 位</text>
  <text x="186" y="227" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="end" fill="#1e293b">Word</text>
  <rect x="200.0" y="206" width="277.0" height="38" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="338.5" y="231" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#334155">word1</text>
  <rect x="480.0" y="206" width="277.0" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="618.5" y="231" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#334155">word0</text>
  <text x="772" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">16 位 × 2</text>
  <text x="186" y="311" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="end" fill="#1e293b">Byte</text>
  <rect x="200.0" y="290" width="137.0" height="38" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="268.5" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#334155">byte3</text>
  <rect x="340.0" y="290" width="137.0" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="408.5" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#334155">byte2</text>
  <rect x="480.0" y="290" width="137.0" height="38" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="548.5" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#334155">byte1</text>
  <rect x="620.0" y="290" width="137.0" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="688.5" y="315" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#334155">byte0</text>
  <text x="772" y="314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">8 位 × 4</text>
  <line x1="200" y1="352" x2="760" y2="352" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="200.0" y1="346" x2="200.0" y2="358" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <text x="200.0" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">bit31</text>
  <line x1="340.0" y1="346" x2="340.0" y2="358" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <text x="340.0" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">bit23</text>
  <line x1="480.0" y1="346" x2="480.0" y2="358" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <text x="480.0" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">bit15</text>
  <line x1="620.0" y1="346" x2="620.0" y2="358" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <text x="620.0" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">bit7</text>
  <line x1="760.0" y1="346" x2="760.0" y2="358" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <text x="760.0" y="380" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="end" fill="#64748b">bit0</text>
  <text x="40" y="414" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#2563eb">图上最左是 bit31，最右是 bit0；而地址按 LSB-first 发，先出去的是 byte0 的 bit0。</text>
  <text x="40" y="438" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">参数页按 Dword 取、CRC 按字节算——数错这一次，后面永远对不上。</text>
</svg>
