<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="412" fill="#ffffff"/>

  <!-- 上层 Die（已减薄） -->
  <text x="290" y="36" text-anchor="middle" fill="#334155" font-size="13">上层 Die（已减薄，仅剩几十 μm）</text>
  <rect x="100" y="46" width="380" height="162" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>

  <!-- TSV 铜柱 -->
  <rect x="130" y="58" width="12" height="132" rx="2" fill="#ea580c"/>
  <rect x="178" y="58" width="12" height="132" rx="2" fill="#ea580c"/>
  <rect x="226" y="58" width="12" height="132" rx="2" fill="#ea580c"/>
  <rect x="274" y="58" width="12" height="132" rx="2" fill="#ea580c"/>
  <rect x="322" y="58" width="12" height="132" rx="2" fill="#ea580c"/>
  <rect x="370" y="58" width="12" height="132" rx="2" fill="#ea580c"/>
  <rect x="418" y="58" width="12" height="132" rx="2" fill="#ea580c"/>
  <rect x="466" y="58" width="12" height="132" rx="2" fill="#ea580c"/>

  <!-- 上层 Die 的布线层（底部） -->
  <line x1="105" y1="196" x2="475" y2="196" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="105" y1="202" x2="475" y2="202" stroke="#8b5cf6" stroke-width="2"/>

  <!-- 层间微凸点 -->
  <circle cx="140" cy="216" r="7" fill="#1e293b"/>
  <circle cx="200" cy="216" r="7" fill="#1e293b"/>
  <circle cx="260" cy="216" r="7" fill="#1e293b"/>
  <circle cx="320" cy="216" r="7" fill="#1e293b"/>
  <circle cx="380" cy="216" r="7" fill="#1e293b"/>
  <circle cx="440" cy="216" r="7" fill="#1e293b"/>

  <!-- 下层 Die -->
  <rect x="90" y="228" width="400" height="108" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="90" y="228" width="400" height="8" fill="#0d9488"/>
  <line x1="95" y1="316" x2="485" y2="316" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="95" y1="324" x2="485" y2="324" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="95" y1="332" x2="485" y2="332" stroke="#8b5cf6" stroke-width="2"/>

  <!-- 到中介层的微凸点 -->
  <circle cx="140" cy="346" r="7" fill="#1e293b"/>
  <circle cx="200" cy="346" r="7" fill="#1e293b"/>
  <circle cx="260" cy="346" r="7" fill="#1e293b"/>
  <circle cx="320" cy="346" r="7" fill="#1e293b"/>
  <circle cx="380" cy="346" r="7" fill="#1e293b"/>
  <circle cx="440" cy="346" r="7" fill="#1e293b"/>

  <!-- 中介层 -->
  <rect x="60" y="356" width="460" height="38" fill="#94a3b8"/>
  <text x="290" y="380" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">中介层（Interposer，内含 TSV）</text>

  <!-- 右侧标注 -->
  <line x1="480" y1="112" x2="500" y2="114" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="505" y="112" text-anchor="start" fill="#ea580c" font-size="13" font-weight="bold">TSV 铜柱</text>
  <text x="505" y="129" text-anchor="start" fill="#64748b" font-size="11">直径约 5~10 μm</text>

  <line x1="476" y1="199" x2="500" y2="199" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="505" y="203" text-anchor="start" fill="#8b5cf6" font-size="12">布线层（BEOL）</text>

  <line x1="447" y1="216" x2="500" y2="234" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="505" y="238" text-anchor="start" fill="#1e293b" font-size="12" font-weight="bold">微凸点（Microbump）</text>

  <line x1="490" y1="272" x2="500" y2="274" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="505" y="278" text-anchor="start" fill="#334155" font-size="12">下层 Die</text>
  <text x="505" y="295" text-anchor="start" fill="#0d9488" font-size="11">顶部薄层 = 晶体管层</text>

  <!-- 底部注释 -->
  <text x="360" y="406" text-anchor="middle" fill="#334155" font-size="12">层间信号只走几微米；而引线键合要绕到芯片边缘，走毫米级</text>
</svg>
