  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">横轴取对数——不然上面两条会缩成一个点</text>
  <rect x="40" y="104" width="800" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
