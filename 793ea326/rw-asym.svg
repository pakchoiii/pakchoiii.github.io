  <rect x="40" y="224" width="800" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="58" y="246" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#ea580c">写 TLC</text>
