<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <rect width="880" height="470" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">从规格书的峰值，到盘上能拿到的带宽</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">四次折扣，一次比一次无声</text>
  <rect x="250" y="96" width="560.0" height="34" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.14"/>
  <text x="40" y="116" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#2563eb">理论峰值</text>
  <text x="40" y="136" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">8 通道 × 800 MT/s × 8 bit</text>
  <text x="262" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#2563eb">6.4 GB/s</text>
  <rect x="250" y="160" width="393.75" height="34" rx="6" fill="#0d9488" stroke="#0d9488" stroke-width="1.3" fill-opacity="0.14"/>
  <text x="40" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#0d9488">× 占空比 0.70</text>
  <text x="40" y="200" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">tR 与命令期间，总线是空的</text>
  <text x="262" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#0d9488">4.5</text>
  <rect x="250" y="224" width="367.5" height="34" rx="6" fill="#ea580c" stroke="#ea580c" stroke-width="1.3" fill-opacity="0.14"/>
  <text x="40" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#ea580c">× 载荷率 0.94</text>
  <text x="40" y="264" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">ECC 与 OOB 占掉一部分</text>
  <text x="262" y="246" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#ea580c">4.2</text>
  <rect x="250" y="288" width="315.0" height="34" rx="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.3" fill-opacity="0.14"/>
  <text x="40" y="308" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#7c3aed">× 主控 / 固件开销</text>
  <text x="40" y="328" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">排队、调度、后台任务</text>
  <text x="262" y="310" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#7c3aed">3.6</text>
  <rect x="250" y="352" width="306.25" height="34" rx="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.3" fill-opacity="0.14"/>
  <text x="40" y="372" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#dc2626">实测顺序读</text>
  <text x="40" y="392" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">示例配置，只作量级参考</text>
  <text x="262" y="374" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#dc2626">约 3.5</text>
  <line x1="810" y1="84" x2="810" y2="386" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <text x="806" y="80" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="end" fill="#94a3b8">峰值 = 1</text>
  <rect x="40" y="410" width="800" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="430" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#334155">这条链路上的数字是示例，链式关系才是重点：任何一环掉下来，后面全部跟着掉。</text>
  <text x="60" y="448" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">而规格书首页印的，永远是第一行那个数。</text>
</svg>
