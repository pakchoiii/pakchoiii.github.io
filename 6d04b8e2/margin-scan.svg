<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 323" width="880" height="323">
  <rect width="880" height="323" rx="16" fill="#ffffff"/>
  <text x="40" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">扫一遍延迟，找到能用的区间，然后取中间</text>
  <text x="40" y="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#64748b">每一格是一个延迟值：蓝＝读对了，灰＝读错了</text>

  <!-- 32 格 -->
  <g>
    <rect x="90" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="112" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="134" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="156" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="178" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="200" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="222" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="244" y="150" width="18" height="40" rx="3" fill="#cbd5e1"/>
    <rect x="266" y="150" width="18" height="40" rx="3" fill="#bfdbfe"/>
    <rect x="288" y="150" width="18" height="40" rx="3" fill="#60a5fa"/>
    <rect x="310" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="332" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="354" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="376" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="398" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="420" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="442" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="464" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="486" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="508" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="530" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="552" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="574" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="596" y="150" width="18" height="40" rx="3" fill="#3b82f6"/>
    <rect x="618" y="150" width="18" height="40" rx="3" fill="#93c5fd"/>
    <rect x="640" y="150" width="18" height="40" rx="3" fill="#cbd5e1"/>
    <rect x="662" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="684" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="706" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="728" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="750" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
    <rect x="772" y="150" width="18" height="40" rx="3" fill="#e2e8f0"/>
  </g>

  <!-- 中点 -->
  <line x1="462" y1="112" x2="462" y2="212" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="6 4"/>
  <path d="M456,106 L468,106 L462,96 Z" fill="#ea580c"/>
  <text x="462" y="88" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" font-weight="700" fill="#c2410c" text-anchor="middle">取中点</text>

  <!-- 边界 -->
  <line x1="288" y1="214" x2="288" y2="234" stroke="#64748b" stroke-width="1.4"/>
  <line x1="636" y1="150" x2="636" y2="234" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="636" y1="214" x2="636" y2="234" stroke="#64748b" stroke-width="1.4"/>
  <line x1="288" y1="224" x2="636" y2="224" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M288,224 L296,220 M288,224 L296,228" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <path d="M636,224 L628,220 M636,224 L628,228" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <text x="471" y="252" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#475569" text-anchor="middle">可用窗口（左边界 ~ 右边界）</text>

  <text x="440" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#334155" text-anchor="middle">为什么取中点而不是边界：边界只是「现在勉强能用」</text>
  <text x="440" y="310" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#94a3b8" text-anchor="middle">温度、电压、老化都会让边界移动；放在正中，两侧都留了余量</text>
</svg>
