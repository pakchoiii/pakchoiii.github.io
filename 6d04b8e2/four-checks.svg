<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 289" width="880" height="289">
  <rect width="880" height="289" rx="16" fill="#ffffff"/>
  <text x="40" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">四道体检，四个维度</text>
  <text x="40" y="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.2" fill="#64748b">每一道修的是一个不同维度上的错位：阻抗、时间、相位、电压</text>

  <!-- ZQ -->
  <rect x="30" y="96" width="190" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="88" y="126" width="74" height="34" rx="4" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M96,134 L106,134 L110,144 L118,134 L126,144 L134,134 L138,144 L148,134 L154,134" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="184" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1e40af" text-anchor="middle">ZQ</text>
  <text x="125" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b" text-anchor="middle">阻抗匹配</text>
  <text x="125" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#94a3b8" text-anchor="middle">外部精密电阻当标尺</text>

  <!-- DCC -->
  <rect x="240" y="96" width="190" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <path d="M258,146 L282,146 L282,124 L306,124 L306,146 L330,146 L330,124 L354,124 L354,146 L378,146 L378,124 L402,124"
        fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <line x1="282" y1="118" x2="282" y2="152" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="330" y1="118" x2="330" y2="152" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="335" y="184" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#6d28d9" text-anchor="middle">DCC</text>
  <text x="335" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b" text-anchor="middle">占空比校正</text>
  <text x="335" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#94a3b8" text-anchor="middle">修时钟两半不等宽</text>

  <!-- Read DQ -->
  <rect x="450" y="96" width="190" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="470" y1="128" x2="620" y2="128" stroke="#ea580c" stroke-width="2"/>
  <path d="M614,122 L622,128 L614,134" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="545" y="118" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#c2410c" text-anchor="middle">DQ</text>
  <line x1="470" y1="152" x2="620" y2="152" stroke="#f97316" stroke-width="2"/>
  <path d="M614,146 L622,152 L614,158" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="545" y="144" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#c2410c" text-anchor="middle">RDQS</text>
  <text x="545" y="184" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#c2410c" text-anchor="middle">Read DQ</text>
  <text x="545" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b" text-anchor="middle">调接收端延迟</text>
  <text x="545" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#94a3b8" text-anchor="middle">NAND 发，主控收</text>

  <!-- Write DQ -->
  <rect x="660" y="96" width="190" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="700" y1="132" x2="810" y2="132" stroke="#475569" stroke-width="2"/>
  <path d="M804,126 L812,132 L804,138" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="755" y="122" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#334155" text-anchor="middle">DQ</text>
  <line x1="700" y1="156" x2="810" y2="156" stroke="#64748b" stroke-width="2"/>
  <path d="M804,150 L812,156 L804,162" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="755" y="148" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#334155" text-anchor="middle">WDQS</text>
  <text x="755" y="184" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Write DQ</text>
  <text x="755" y="206" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#64748b" text-anchor="middle">调发送端延迟</text>
  <text x="755" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#94a3b8" text-anchor="middle">写进去再读回来验证</text>

  <text x="440" y="276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#94a3b8" text-anchor="middle">NV-LPDDR4 还有第五道：内部参考电压 VrefQ 校准，治判决门限偏差</text>
</svg>
