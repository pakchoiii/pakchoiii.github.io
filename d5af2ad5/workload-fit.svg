<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <text x="360" y="28" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">工作负载匹配：谁跟谁对味</text>

  <!-- 训练 -->
  <rect x="40" y="70" width="190" height="110" rx="10" fill="#2563eb"/>
  <text x="135" y="110" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">训练 Training</text>
  <text x="135" y="138" text-anchor="middle" fill="#ffffff" font-size="11">梯度高频随机读写</text>
  <text x="135" y="160" text-anchor="middle" fill="#ffffff" font-size="11">每个训练步都写参数</text>

  <line x1="230" y1="125" x2="420" y2="125" stroke="#334155" stroke-width="2"/>
  <polygon points="430,125 416,118 416,132" fill="#334155"/>
  <text x="325" y="114" text-anchor="middle" fill="#64748b" font-size="11">高频随机写</text>

  <rect x="430" y="70" width="250" height="110" rx="10" fill="#0d9488"/>
  <text x="545" y="108" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">HBM</text>
  <text x="545" y="134" text-anchor="middle" fill="#ffffff" font-size="11">随机写随意 · 纳秒级延迟</text>
  <rect x="618" y="82" width="52" height="24" rx="12" fill="#ffffff"/>
  <text x="644" y="98" text-anchor="middle" fill="#0d9488" font-size="11" font-weight="bold">✓ 对味</text>

  <rect x="430" y="192" width="250" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="555" y="215" text-anchor="middle" fill="#64748b" font-size="11">换 HBF？写慢 + P/E 寿命 ✗</text>

  <!-- 推理 -->
  <rect x="40" y="250" width="190" height="110" rx="10" fill="#8b5cf6"/>
  <text x="135" y="290" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">推理 Inference</text>
  <text x="135" y="318" text-anchor="middle" fill="#ffffff" font-size="11">权重只读 · KV 读多写少</text>
  <text x="135" y="340" text-anchor="middle" fill="#ffffff" font-size="11">读个不停 · 偶尔写写</text>

  <line x1="230" y1="305" x2="420" y2="305" stroke="#334155" stroke-width="2"/>
  <polygon points="430,305 416,298 416,312" fill="#334155"/>
  <text x="325" y="294" text-anchor="middle" fill="#64748b" font-size="11">读多写少</text>

  <rect x="430" y="250" width="250" height="110" rx="10" fill="#ea580c"/>
  <text x="545" y="288" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">HBF</text>
  <text x="545" y="314" text-anchor="middle" fill="#ffffff" font-size="11">容量大 · 读得快 · 预计便宜</text>
  <rect x="618" y="262" width="52" height="24" rx="12" fill="#ffffff"/>
  <text x="644" y="278" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="bold">✓ 对味</text>

  <rect x="430" y="372" width="250" height="36" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="555" y="395" text-anchor="middle" fill="#64748b" font-size="11">换 HBM？能干，但容量贵 ✗</text>
</svg>
