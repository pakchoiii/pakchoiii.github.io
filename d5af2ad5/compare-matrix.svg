<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="480" fill="#ffffff"/>

  <text x="440" y="30" text-anchor="middle" fill="#1e293b" font-size="16" font-weight="bold">HBM vs HBF：六个关键维度</text>

  <!-- 表头 -->
  <rect x="50" y="56" width="360" height="48" rx="10" fill="#0d9488"/>
  <text x="230" y="86" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">HBM · 高带宽内存</text>
  <rect x="470" y="56" width="360" height="48" rx="10" fill="#ea580c"/>
  <text x="650" y="86" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">HBF · 高带宽闪存</text>

  <!-- 行 1：本质 -->
  <rect x="50" y="124" width="360" height="48" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="230" y="153" text-anchor="middle" fill="#334155" font-size="13">DRAM · 易失（断电丢）</text>
  <text x="440" y="153" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">本质</text>
  <rect x="470" y="124" width="360" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="153" text-anchor="middle" fill="#334155" font-size="13">NAND Flash · 非易失（断电不丢）</text>

  <!-- 行 2：单堆栈容量 -->
  <rect x="50" y="180" width="360" height="48" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="230" y="209" text-anchor="middle" fill="#334155" font-size="13">HBM4 约 48 GB（16 层）</text>
  <text x="440" y="209" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">单堆栈容量</text>
  <rect x="470" y="180" width="360" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="209" text-anchor="middle" fill="#334155" font-size="13">最高约 512 GB（16 层 · 约 10 倍）</text>

  <!-- 行 3：带宽 -->
  <rect x="50" y="236" width="360" height="48" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="230" y="265" text-anchor="middle" fill="#334155" font-size="13">HBM4 约 2 TB/s（2048 位）</text>
  <text x="440" y="265" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">带宽</text>
  <rect x="470" y="236" width="360" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="265" text-anchor="middle" fill="#334155" font-size="13">约 0.4 ~ 3 TB/s（Grade 1~3）</text>

  <!-- 行 4：延迟 -->
  <rect x="50" y="292" width="360" height="48" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="230" y="321" text-anchor="middle" fill="#334155" font-size="13">纳秒级</text>
  <text x="440" y="321" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">延迟</text>
  <rect x="470" y="292" width="360" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="321" text-anchor="middle" fill="#334155" font-size="13">微秒级 · 约高两个数量级</text>

  <!-- 行 5：写入特性 -->
  <rect x="50" y="348" width="360" height="48" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="230" y="377" text-anchor="middle" fill="#334155" font-size="13">随机读写随意</text>
  <text x="440" y="377" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">写入特性</text>
  <rect x="470" y="348" width="360" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="377" text-anchor="middle" fill="#334155" font-size="13">写慢 · 有 P/E 寿命 → 读多写少</text>

  <!-- 行 6：预计成本 -->
  <rect x="50" y="404" width="360" height="48" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="230" y="433" text-anchor="middle" fill="#334155" font-size="13">贵（每单位容量）</text>
  <text x="440" y="433" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="bold">预计成本</text>
  <rect x="470" y="404" width="360" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="433" text-anchor="middle" fill="#334155" font-size="13">预计便宜约一个量级 · 待量产验证</text>

  <!-- 底注 -->
  <text x="440" y="472" text-anchor="middle" fill="#64748b" font-size="12">带宽数字接近，延迟差约两个数量级——吞吐量与反应速度是两回事</text>
</svg>
