<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <marker id="arr0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="880" height="440" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">一遍写到位，峰会被邻居捂散</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">先粗编定位置，等邻居都到位，再统一收紧</text>
  <text x="190" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#dc2626">① 一次性写到位</text>
  <line x1="60" y1="250" x2="340" y2="250" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M47,250 C59.4,250 64.98,176 78,176 C91.02,176 96.6,250 109,250" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
  <path d="M119,250 C131.4,250 136.98,176 150,176 C163.02,176 168.6,250 181,250" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
  <path d="M191,250 C203.4,250 208.98,176 222,176 C235.02,176 240.6,250 253,250" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
  <path d="M263,250 C275.4,250 280.98,176 294,176 C307.02,176 312.6,250 325,250" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
  <text x="200" y="286" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#991b1b">分布被相邻 Cell 的编程干扰捂宽</text>
  <text x="200" y="306" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">峰挨在一起，读的时候分不开</text>
  <text x="680" y="96" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#0d9488">② 粗编 + 精修</text>
  <line x1="450" y1="250" x2="830" y2="250" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M431,250 C446.6,250 453.62,170 470,170 C486.38,170 493.4,250 509,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
  <path d="M450,250 C458,250 461.6,170 470,170 C478.4,170 482,250 490,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M523,250 C538.6,250 545.62,170 562,170 C578.38,170 585.4,250 601,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
  <path d="M542,250 C550,250 553.6,170 562,170 C570.4,170 574,250 582,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M615,250 C630.6,250 637.62,170 654,170 C670.38,170 677.4,250 693,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
  <path d="M634,250 C642,250 645.6,170 654,170 C662.4,170 666,250 674,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M707,250 C722.6,250 729.62,170 746,170 C762.38,170 769.4,250 785,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
  <path d="M726,250 C734,250 737.6,170 746,170 C754.4,170 758,250 766,250" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="286" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#115e59">粗编只定大致位置；邻居都写完，再统一往里收</text>
  <text x="640" y="306" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">收的时候偏移小，二次干扰也小</text>
  <line x1="360" y1="190" x2="420" y2="190" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr0)"/>
  <text x="390" y="178" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">分两步</text>
  <rect x="40" y="340" width="800" height="72" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="64" y="370" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">编程高压会顺带加热邻居（program disturb），Cell 之间的耦合也会把分布抹开——</text>
  <text x="64" y="396" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">一次写 16 档，先落位的峰会被后写的邻居捂散；两遍编程就是把这个先后顺序摆对。</text>
</svg>
