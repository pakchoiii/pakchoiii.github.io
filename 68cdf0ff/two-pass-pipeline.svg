  <rect x="708" y="182" width="132" height="32" rx="6" fill="#eff6ff" stroke="#7daffc" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="774.0" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#60a5fa">精修（排队）</text>
  <text x="24" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" fill="#334155">WLn+2</text>
  <rect x="376" y="240" width="132" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="442.0" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#1e40af">粗编</text>
  <rect x="708" y="240" width="132" height="32" rx="6" fill="#eff6ff" stroke="#7daffc" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="774.0" y="262" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#60a5fa">精修（排队）</text>
  <text x="24" y="320" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" fill="#334155">WLn+3</text>
  <rect x="526" y="298" width="132" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="592.0" y="320" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#1e40af">粗编</text>
  <rect x="708" y="298" width="132" height="32" rx="6" fill="#eff6ff" stroke="#7daffc" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="774.0" y="320" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#60a5fa">精修（排队）</text>
  <text x="468" y="114" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">等这一批邻居的粗编都落位，再回头精修 WLn</text>
  <rect x="42" y="356" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="64" y="369" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#334155">粗编：只定位置，宽窄不管</text>
