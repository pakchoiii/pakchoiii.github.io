  <text x="322" y="369" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#334155">精修：邻居落定后再收紧</text>
  <text x="42" y="402" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">中间这段不是空等：邻居写完，它们对 WLn 的耦合也就落定了，此时定最终位置才准。</text>
