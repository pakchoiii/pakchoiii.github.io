  <text x="142.0" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#1e40af">粗编</text>
  <line x1="208" y1="140.0" x2="708" y2="140.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <rect x="708" y="124" width="132" height="32" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.2"/>
  <text x="774.0" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#ffffff">精修</text>
  <text x="24" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" fill="#334155">WLn+1</text>
  <rect x="226" y="182" width="132" height="32" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
