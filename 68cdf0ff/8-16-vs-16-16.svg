<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <rect width="880" height="470" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">两种两遍方案，一笔明账</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">没有免费的选择，只有拿写换读，或者拿读换写</text>
  <rect x="40" y="92" width="380" height="300" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="40" y="92" width="380" height="54" rx="12" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="40" y="132" width="380" height="14" rx="0" fill="#2563eb"/>
  <text x="64" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#ffffff">8-16</text>
  <text x="150" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#ffffff" fill-opacity="0.9">粗编 8 档，精修劈成 16</text>
  <text x="64" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">粗编验证电平  8 个</text>
  <text x="64" y="214" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">写：快</text>
  <text x="64" y="248" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">读：慢（最差要问 8 次）</text>
  <text x="64" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">读窗口：窄</text>
  <line x1="64" y1="322" x2="396" y2="322" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <text x="64" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#2563eb">适合：一次灌进去、很少再读</text>
  <rect x="460" y="92" width="380" height="300" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <rect x="460" y="92" width="380" height="54" rx="12" fill="#ea580c" stroke="#ea580c" stroke-width="1.4"/>
  <rect x="460" y="132" width="380" height="14" rx="0" fill="#ea580c"/>
  <text x="484" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#ffffff">16-16</text>
  <text x="570" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#ffffff" fill-opacity="0.9">粗编直接 16 档，精修只收紧</text>
  <text x="484" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">粗编验证电平  15 个</text>
  <text x="484" y="214" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">写：慢</text>
  <text x="484" y="248" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">读：快（常规 15 个电平）</text>
  <text x="484" y="282" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" fill="#334155">读窗口：宽</text>
  <line x1="484" y1="322" x2="816" y2="322" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <text x="484" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#ea580c">适合：读得多、写得少</text>
  <rect x="40" y="412" width="800" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="440" y="440" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" text-anchor="middle" fill="#64748b">同一块 die，选哪条路，取决于这块盘被拿来干什么</text>
</svg>
