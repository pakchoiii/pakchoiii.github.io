<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420">
  <defs>
    <marker id="arr0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="880" height="420" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">「改」被翻译成「写新地方 + 改地址」</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">覆盖写这件事，在 NAND 里物理上不存在</text>
  <text x="40" y="100" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">逻辑地址</text>
  <text x="300" y="100" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">映射表</text>
  <text x="600" y="100" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">物理页</text>
  <rect x="40" y="116" width="180" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="130" y="182" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#1e293b">LBA 0x1A2</text>
  <rect x="260" y="116" width="150" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="335" y="160" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" text-anchor="middle" fill="#2563eb">0x1A2 → P3</text>
  <text x="335" y="190" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">（DRAM 里常驻）</text>
  <line x1="222" y1="176" x2="252" y2="176" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr0)"/>
  <rect x="450" y="108" width="390" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="470" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#2563eb">P3</text>
  <text x="520" y="132" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#1e40af">新数据写在这里（追加写）</text>
  <text x="470" y="154" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">写一次的成本：一页编程 + 一次映射更新</text>
  <rect x="450" y="180" width="390" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="470" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">P1</text>
  <text x="520" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">旧数据还在，但已作废（invalid）</text>
  <text x="470" y="226" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#94a3b8">空间没有还给你，要等 GC 来收</text>
  <rect x="40" y="268" width="800" height="136" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="64" y="302" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" font-weight="700" fill="#9a3412">于是三笔开销凭空出现：</text>
  <text x="64" y="332" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">① 总得有空白页可写——这就是 OP（预留空间）的由来；</text>
  <text x="64" y="362" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">② 作废的页要有人回收——这就是 GC 与写放大；</text>
  <text x="64" y="392" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">③ 映射表得随时查得到——这就是盘上那颗 DRAM。</text>
</svg>
