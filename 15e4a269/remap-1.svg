<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" width="880" height="348">
  <defs>
    <marker id="arr0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="880" height="348" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23.5" font-weight="700" fill="#1e293b">第一步，新数据另写一页</text>
  <text x="40" y="76" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#64748b">P1 原地不动——NAND 里没有「覆盖」这个动作</text>
  <text x="40" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">逻辑地址</text>
  <text x="246" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">映射表</text>
  <text x="486" y="126" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">物理页</text>
  <line x1="214" y1="200" x2="242" y2="200" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr0)"/>
  <line x1="450" y1="200" x2="482" y2="232.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr1)"/>
  <rect x="40" y="140" width="170" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/>
  <text x="125.0" y="196" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#9a3412">LBA 0x1A2</text>
  <text x="125.0" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#ea580c">要覆盖写 4 KB</text>
  <rect x="246" y="140" width="200" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="346.0" y="204" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17.3" font-weight="700" text-anchor="middle" fill="#1e40af">0x1A2 → P1</text>
  <text x="346.0" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" text-anchor="middle" fill="#64748b">还没改，仍指着旧页</text>
  <rect x="486" y="140" width="354" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="506" y="164" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#2563eb">P3</text>
  <text x="544" y="164" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#1e40af">新数据写在这里</text>
  <text x="506" y="185" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#94a3b8">追加写，不是原地改</text>
  <rect x="486" y="204" width="354" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="506" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" font-weight="700" fill="#64748b">P1</text>
  <text x="544" y="228" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#64748b">原有数据</text>
  <text x="506" y="249" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16.2" fill="#94a3b8">有效，映射还指着它</text>
  <rect x="40" y="284" width="800" height="56" rx="10" fill="#ffedd5" stroke="#9a3412" stroke-width="1.1" fill-opacity="0.55"/>
  <text x="64" y="318" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18.8" fill="#9a3412">同一份数据在物理上变成两份：P1 一份旧的，P3 一份新的</text>
</svg>
